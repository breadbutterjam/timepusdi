<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Moon Phase Viewer</title>
<link rel="preconnect" href="https://timepusdi.vercel.app">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <div class="top-text">
        <div class="gujarati-date" id="gujaratiDate">Loading…</div>
        <div class="phase-line" id="phaseLine">&nbsp;</div>
        <div class="nav-row">
            <button class="nav-btn" id="prevDayBtn" aria-label="Previous day">‹</button>
            <div class="till-line" id="tillLine"></div>
            <button class="nav-btn" id="nextDayBtn" aria-label="Next day">›</button>
        </div>
        <div class="today-link" id="todayLink" role="button" tabindex="0">today</div>
    </div>

    <div class="moon-wrap" id="moonWrap">
        <img class="moon-img" id="moonImage" alt="Moon phase">
        <div class="moon-css" id="moonCss"><div class="moon-light" id="moonLight"></div></div>
    </div>

    <div class="bottom-text">
        <div class="upcoming-row clickable" id="phase1Row" role="button" tabindex="0">
            <div class="upcoming-label" id="phase1Label">next full moon</div>
            <div class="upcoming-date" id="phase1Date">Loading…</div>
        </div>
        <div class="upcoming-row clickable" id="phase2Row" role="button" tabindex="0">
            <div class="upcoming-label" id="phase2Label">next new moon</div>
            <div class="upcoming-date" id="phase2Date">Loading…</div>
        </div>
    </div>

    <div class="error-note" id="errorNote"></div>
</div>

<!-- Detail view: opened by tapping the moon. Shares the same day
     pointer as the main screen (‹ › here shift the day, exactly like
     the main screen's nav) and adds the info the compact view hides:
     the tithi's end time(s) and the settings gear. -->
<div class="detail-view" id="detailView">
    <button class="detail-close" id="detailClose" aria-label="Close">&times;</button>
    <button class="detail-settings" id="detailSettingsBtn" aria-label="Settings">&#9881;</button>

    <div class="detail-header">
        <div class="nav-row">
            <button class="nav-btn" id="detailPrevBtn" aria-label="Previous day">‹</button>
            <div class="till-line" id="detailDateLine"></div>
            <button class="nav-btn" id="detailNextBtn" aria-label="Next day">›</button>
        </div>
        <div class="today-link" id="detailTodayLink" role="button" tabindex="0">today</div>
        <div class="detail-heading" id="detailPhaseHeading">Loading…</div>
        <div class="till-line" id="detailSunriseLine"></div>
        <div class="detail-heading" id="detailTithiHeading"></div>
        <div class="till-line" id="detailTillLine1"></div>
        <div class="till-line" id="detailTillLine2"></div>
    </div>

    <div class="detail-photo-wrap">
        <img class="moon-img" id="detailImage" alt="Moon phase, full view">
        <div class="moon-css" id="detailCss" style="width:min(80vw,360px); height:min(80vw,360px);">
            <div class="moon-light" id="detailLight"></div>
        </div>
    </div>

    <div class="detail-footer">
        <div class="upcoming-row">
            <div class="upcoming-label" id="detailPhase1Label">next full moon</div>
            <div class="upcoming-date" id="detailPhase1Date">Loading…</div>
        </div>
        <div class="upcoming-row">
            <div class="upcoming-label" id="detailPhase2Label">next new moon</div>
            <div class="upcoming-date" id="detailPhase2Date">Loading…</div>
        </div>
    </div>

    <!-- Settings panel: which tithi "wins" a calendar day. -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-title">Tithi selection</div>
        <label class="settings-option">
            <input type="radio" name="tithiMode" value="sunrise" id="modeSunrise">
            <span>Tithi at sunrise<br><small>Mumbai — the tithi active at sunrise represents the day</small></span>
        </label>
        <label class="settings-option">
            <input type="radio" name="tithiMode" value="majority" id="modeMajority">
            <span>Tithi with max hours<br><small>whichever tithi occupies the most of the calendar day</small></span>
        </label>
        <button class="settings-done" id="settingsDoneBtn">Done</button>
    </div>
</div>

<script src="js/suncalc.js"></script>
<script src="js/ephemeris.js"></script>
<script src="js/tithi-engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
