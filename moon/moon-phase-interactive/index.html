<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Moon Phase Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     DESIGN TOKENS — swap these to reskin the whole visualizer
     ============================================================ */
  :root {
    --bg: #030407;
    --panel-bg: rgba(12, 15, 24, 0.55);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text-primary: #eae6da;
    --text-secondary: rgba(234, 230, 218, 0.55);
    --accent: #d9b46c;
    --accent-dim: rgba(217, 180, 108, 0.35);
    --track: rgba(255, 255, 255, 0.14);
    --radius-lg: 18px;
    --radius-sm: 10px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
    font-family: var(--font);
  }

  /* ============================================================
     LAYOUT — 3D canvas fills the screen, UI floats above it
     ============================================================ */
  #scene-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #scene-container canvas { display: block; }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    font-size: 13px;
    letter-spacing: 0.04em;
    background: var(--bg);
    z-index: 50;
    transition: opacity 0.6s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }

  /* Picture-in-picture label for the Earth-view moon */
  #pip-label {
    position: fixed;
    top: calc(20px + env(safe-area-inset-top, 0px));
    right: 20px;
    width: 132px;
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--text-secondary);
    pointer-events: none;
  }
  #pip-frame {
    position: fixed;
    top: calc(44px + env(safe-area-inset-top, 0px));
    right: 20px;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    border: 1px solid var(--panel-border);
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03), transparent 70%);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    overflow: hidden;
    pointer-events: none;
  }
  /* Real phase photo, layered above the live-rendered fallback canvas.
     Hidden until a matching images/moon-<slug>.webp is found. */
  #pip-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  /* ============================================================
     CONTROL PANEL — bottom-center, glass card
     ============================================================ */
  #controls {
    position: fixed;
    left: 50%;
    bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(560px, calc(100vw - 32px));
    background: var(--panel-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-lg);
    padding: 8px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    z-index: 20;
  }
  #controls .row { flex: 1; }
  #controls .hint { display: none; }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  #play-toggle {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.04);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  #play-toggle:hover { border-color: var(--accent-dim); }
  #play-toggle svg { width: 13px; height: 13px; }

  #scrubber {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    border-radius: 2px;
    background: var(--track);
    outline: none;
    cursor: pointer;
  }
  #scrubber::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid rgba(3,4,7,0.8);
    box-shadow: 0 0 0 3px rgba(217,180,108,0.15);
    cursor: pointer;
    margin-top: -6px;
  }
  #scrubber::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid rgba(3,4,7,0.8);
    cursor: pointer;
  }
  #scrubber::-webkit-slider-runnable-track { height: 2px; border-radius: 2px; background: var(--track); }
  #scrubber::-moz-range-track { height: 2px; border-radius: 2px; background: var(--track); }

  .row-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .hint {
    font-size: 10.5px;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }

  #view-toggle {
    display: flex;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-sm);
    padding: 2px;
    gap: 2px;
  }
  #view-toggle button {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: var(--font);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  #view-toggle button.active {
    background: rgba(217, 180, 108, 0.16);
    color: var(--accent);
  }

  /* ============================================================
     PHASE INFO PANEL — angle / phase / tithi readout
     ============================================================ */
  #phase-info-panel {
    position: fixed;
    top: calc(190px + env(safe-area-inset-top, 0px));
    right: 20px;
    width: 190px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: var(--panel-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    z-index: 20;
  }
  #phase-info-panel .info-label {
    font-size: 10.5px;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    margin-bottom: 3px;
  }
  #phase-info-panel .info-value {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.005em;
  }
  #phase-info-panel.hidden { display: none; }
  #phase-info-panel .info-block.hidden { display: none; }

  /* ============================================================
     SETTINGS GEAR + PANEL
     ============================================================ */
  #settings-toggle {
    position: fixed;
    right: 20px;
    bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--panel-border);
    background: var(--panel-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 21;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  #settings-toggle:hover { color: var(--text-primary); border-color: var(--accent-dim); }
  #settings-toggle svg { width: 16px; height: 16px; }
  #settings-toggle.active { color: var(--accent); border-color: var(--accent-dim); }

  #settings-panel {
    position: fixed;
    right: 20px;
    bottom: calc(70px + env(safe-area-inset-bottom, 0px));
    width: 220px;
    background: var(--panel-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 21;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  #settings-panel.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .settings-title {
    font-size: 10.5px;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 0;
    font-size: 12px;
    color: var(--text-primary);
    cursor: pointer;
  }
  .toggle-row-nested {
    padding-left: 14px;
    font-size: 11.5px;
    color: var(--text-secondary);
  }
  .toggle {
    position: relative;
    flex: 0 0 auto;
    width: 32px;
    height: 18px;
  }
  .toggle input {
    position: absolute;
    inset: 0;
    opacity: 0;
    margin: 0;
    cursor: pointer;
  }
  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--track);
    border-radius: 999px;
    transition: background 0.2s ease;
  }
  .toggle-track::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text-primary);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .toggle input:checked + .toggle-track {
    background: var(--accent-dim);
  }
  .toggle input:checked + .toggle-track::before {
    transform: translateX(14px);
    background: var(--accent);
  }
  .toggle input:disabled + .toggle-track { opacity: 0.4; }

  @media (max-width: 480px) {
    #pip-label { width: 96px; right: 14px; top: calc(14px + env(safe-area-inset-top, 0px)); font-size: 9.5px; }
    #pip-frame { width: 96px; height: 96px; right: 14px; top: calc(32px + env(safe-area-inset-top, 0px)); }
    #phase-info-panel { right: 14px; top: calc(138px + env(safe-area-inset-top, 0px)); width: 150px; padding: 12px 16px; gap: 10px; }
    #phase-info-panel .info-value { font-size: 14px; }
  }

  /* ============================================================
     ROTATE-TO-LANDSCAPE PROMPT — mobile portrait only
     ============================================================ */
  #rotate-message {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px;
    text-align: center;
  }
  #rotate-message svg {
    width: 46px;
    height: 46px;
    color: var(--accent);
    animation: rotate-hint 1.8s ease-in-out infinite;
  }
  #rotate-message p {
    margin: 0;
    color: var(--text-primary);
    font-size: 14px;
    letter-spacing: 0.02em;
    max-width: 240px;
  }
  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }

  /* Phones/tablets held in portrait: hide the app, show the prompt */
  @media (orientation: portrait) and (max-width: 900px) {
    #scene-container, #controls, #pip-frame, #pip-label, #loading,
    #phase-info-panel, #settings-toggle, #settings-panel { display: none !important; }
    #rotate-message { display: flex; }
  }

  /* Mobile landscape: dock the control panel flush to the bottom edge, borderless */
  @media (orientation: landscape) and (max-height: 500px) {
    #controls {
      bottom: 0;
      border: none;
      background: transparent;
    }
    #phase-info-panel { padding: 10px 14px; gap: 8px; top: calc(184px + env(safe-area-inset-top, 0px)); right: 12px; width: 170px; }
    #phase-info-panel .info-label { font-size: 9.5px; margin-bottom: 1px; }
    #phase-info-panel .info-value { font-size: 13px; }
    #settings-panel { bottom: calc(58px + env(safe-area-inset-bottom, 0px)); width: 190px; padding: 10px 14px; }
  }
</style>

</head>
<body>

<div id="loading">calibrating orbit…</div>

<div id="rotate-message">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="3" width="12" height="18" rx="2"></rect>
    <line x1="10" y1="19" x2="14" y2="19"></line>
  </svg>
  <p>Rotate your phone to landscape to view the moon phase visualizer.</p>
</div>

<div id="scene-container"></div>

<div id="pip-label">moon from earth</div>
<div id="pip-frame"><canvas id="pip-canvas"></canvas><img id="pip-photo" alt="" /></div>

<div id="phase-info-panel">
  <div class="info-block" data-info="angle">
    <div class="info-label">Angle difference</div>
    <div class="info-value" id="val-angle">0&deg;</div>
  </div>
  <div class="info-block" data-info="phase">
    <div class="info-label">Phase</div>
    <div class="info-value" id="val-phase">New Moon</div>
  </div>
  <div class="info-block" data-info="tithi">
    <div class="info-label">Tithi</div>
    <div class="info-value" id="val-tithi">Vad Amas</div>
  </div>
</div>

<button id="settings-toggle" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
</button>

<div id="settings-panel">
  <div class="settings-title">Display</div>
  <label class="toggle-row">
    <span>Sun–Earth–Moon lines</span>
    <span class="toggle"><input type="checkbox" id="toggle-lines" checked><span class="toggle-track"></span></span>
  </label>
  <label class="toggle-row">
    <span>Info panel</span>
    <span class="toggle"><input type="checkbox" id="toggle-info-panel" checked><span class="toggle-track"></span></span>
  </label>
  <label class="toggle-row toggle-row-nested">
    <span>Angle</span>
    <span class="toggle"><input type="checkbox" id="toggle-angle" checked><span class="toggle-track"></span></span>
  </label>
  <label class="toggle-row toggle-row-nested">
    <span>Moon phase</span>
    <span class="toggle"><input type="checkbox" id="toggle-phase" checked><span class="toggle-track"></span></span>
  </label>
  <label class="toggle-row toggle-row-nested">
    <span>Tithi</span>
    <span class="toggle"><input type="checkbox" id="toggle-tithi" checked><span class="toggle-track"></span></span>
  </label>
</div>

<div id="controls">
  <div class="row">
    <button id="play-toggle" aria-label="Play">
      <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <input type="range" id="scrubber" min="0" max="1000" value="0" step="1" aria-label="Moon orbital position" />
  </div>
  <div class="row-bottom">
    <span class="hint">new moon → full moon → new moon</span>
    <div id="view-toggle">
      <button id="btn-top" class="active">Top-down</button>
      <button id="btn-side">Side-on</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  /* ============================================================
     CONFIG — tune the not-to-scale geometry here
     ============================================================ */
  var CONFIG = {
    earthRadius: 6,
    moonRadius: 1.55,
    moonOrbitRadius: 15.5,
    sunRadius: 22,
    sunDistanceX: 70,           // sun anchored far to the left, off-axis pivot
    earthAxialSpinSpeed: 0.035, // radians/sec, auto-spin — stops permanently once the user drags Earth
    earthDragSensitivity: 0.008, // radians of spin per pixel of drag
    orbitCycleSeconds: 24,      // seconds for one full auto-play lunar cycle
    camDistance: 60,            // pulled back so the moon's orbit ring clears the frame vertically
    camThetaTopDown: 0.16,      // radians from vertical (~9°) — avoids gimbal lock
    camThetaSideOn: Math.PI / 2 - 0.05,
    camTweenSpeed: 3.2
  };

  var container = document.getElementById('scene-container');
  var pipCanvas = document.getElementById('pip-canvas');

  /* ============================================================
     RENDERER / SCENE / CAMERA
     ============================================================ */
  var scene = new THREE.Scene();

  var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 2000);
  var camTheta = CONFIG.camThetaTopDown;
  var camThetaTarget = CONFIG.camThetaTopDown;

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  var pipRenderer = new THREE.WebGLRenderer({ canvas: pipCanvas, antialias: true, alpha: true });
  pipRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  var pipCamera = new THREE.PerspectiveCamera(9, 1, 0.1, 500);

  /* ============================================================
     STARFIELD
     ============================================================ */
  function createStarfield() {
    var starCount = 2200;
    var positions = new Float32Array(starCount * 3);
    var sizes = new Float32Array(starCount);
    for (var i = 0; i < starCount; i++) {
      var radius = 300 + Math.random() * 500;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.acos((Math.random() * 2) - 1);
      positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = radius * Math.cos(phi);
      positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
      sizes[i] = Math.random() * 1.6 + 0.3;
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    var mat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 1.1,
      sizeAttenuation: true,
      transparent: true,
      opacity: 0.8
    });
    var points = new THREE.Points(geo, mat);
    scene.add(points);
  }

  /* ============================================================
     TEXTURE HELPERS — procedural canvases (no external images:
     published pages can't fetch remote textures, so everything
     is painted at runtime)
     ============================================================ */
  function seededRandom(seed) {
    var s = seed;
    return function () {
      s = (s * 9301 + 49297) % 233280;
      return s / 233280;
    };
  }

  function drawBlob(ctx, cx, cy, r, wobble, points, rand, fillStyle) {
    ctx.beginPath();
    var coords = [];
    for (var i = 0; i <= points; i++) {
      var angle = (i / points) * Math.PI * 2;
      var noise = 1 + (rand() - 0.5) * wobble + Math.sin(angle * 3 + rand()) * wobble * 0.4;
      var rad = r * noise;
      coords.push([cx + Math.cos(angle) * rad, cy + Math.sin(angle) * rad * 0.72]);
    }
    ctx.moveTo(coords[0][0], coords[0][1]);
    for (var j = 1; j < coords.length - 2; j += 1) {
      var xc = (coords[j][0] + coords[j + 1][0]) / 2;
      var yc = (coords[j][1] + coords[j + 1][1]) / 2;
      ctx.quadraticCurveTo(coords[j][0], coords[j][1], xc, yc);
    }
    ctx.closePath();
    ctx.fillStyle = fillStyle;
    ctx.fill();
  }

  function createEarthTexture() {
    var w = 1536, h = 768;
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');

    // Ocean base
    var oceanGrad = ctx.createLinearGradient(0, 0, 0, h);
    oceanGrad.addColorStop(0, '#0d3d5c');
    oceanGrad.addColorStop(0.5, '#155a82');
    oceanGrad.addColorStop(1, '#0a3049');
    ctx.fillStyle = oceanGrad;
    ctx.fillRect(0, 0, w, h);

    // Subtle ocean noise bands
    var rand = seededRandom(42);
    for (var n = 0; n < 260; n++) {
      ctx.globalAlpha = 0.03 + rand() * 0.04;
      ctx.fillStyle = rand() > 0.5 ? '#2a7ba8' : '#08283c';
      var bx = rand() * w, by = rand() * h, br = 20 + rand() * 90;
      ctx.beginPath();
      ctx.ellipse(bx, by, br, br * 0.4, rand() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Rough continents (fractional u,v -> canvas coords), stylized not literal
    var landColor1 = '#4c7a44';
    var landColor2 = '#6f8f4f';
    var landColor3 = '#8a7a51';
    var continents = [
      { u: 0.51, v: 0.50, r: 95, wob: 0.55, pts: 14, seed: 3, col: landColor1 },
      { u: 0.47, v: 0.36, r: 60, wob: 0.5, pts: 12, seed: 7, col: landColor3 },
      { u: 0.63, v: 0.27, r: 150, wob: 0.45, pts: 16, seed: 11, col: landColor2 },
      { u: 0.78, v: 0.22, r: 70, wob: 0.5, pts: 12, seed: 17, col: landColor1 },
      { u: 0.19, v: 0.28, r: 95, wob: 0.5, pts: 13, seed: 23, col: landColor2 },
      { u: 0.15, v: 0.45, r: 55, wob: 0.55, pts: 11, seed: 29, col: landColor1 },
      { u: 0.27, v: 0.62, r: 85, wob: 0.5, pts: 13, seed: 31, col: landColor1 },
      { u: 0.84, v: 0.68, r: 50, wob: 0.55, pts: 11, seed: 37, col: landColor3 },
      { u: 0.52, v: 0.90, r: 130, wob: 0.3, pts: 14, seed: 41, col: '#dfeaf0' }
    ];
    continents.forEach(function (c) {
      var r2 = seededRandom(c.seed);
      drawBlob(ctx, c.u * w, c.v * h, c.r, c.wob, c.pts, r2, c.col);
    });

    // Polar caps
    var poleGradTop = ctx.createLinearGradient(0, 0, 0, h * 0.09);
    poleGradTop.addColorStop(0, 'rgba(235,245,250,0.95)');
    poleGradTop.addColorStop(1, 'rgba(235,245,250,0)');
    ctx.fillStyle = poleGradTop;
    ctx.fillRect(0, 0, w, h * 0.09);
    var poleGradBottom = ctx.createLinearGradient(0, h * 0.9, 0, h);
    poleGradBottom.addColorStop(0, 'rgba(235,245,250,0)');
    poleGradBottom.addColorStop(1, 'rgba(235,245,250,0.95)');
    ctx.fillStyle = poleGradBottom;
    ctx.fillRect(0, h * 0.9, w, h * 0.1);

    var tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    return tex;
  }

  function createCloudTexture() {
    var w = 1536, h = 768;
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    var rand = seededRandom(99);
    for (var i = 0; i < 46; i++) {
      var cx = rand() * w, cy = rand() * h * 0.85 + h * 0.05;
      var r = 40 + rand() * 110;
      var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, 'rgba(255,255,255,0.5)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r, r * 0.45, rand() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
    var tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    return tex;
  }

  function createMoonTexture() {
    var w = 1024, h = 512;
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#9a968f';
    ctx.fillRect(0, 0, w, h);

    var rand = seededRandom(5);
    // Maria (dark smooth patches)
    for (var m = 0; m < 6; m++) {
      var mx = rand() * w, my = rand() * h * 0.8 + h * 0.1, mr = 60 + rand() * 90;
      var grad = ctx.createRadialGradient(mx, my, 0, mx, my, mr);
      grad.addColorStop(0, 'rgba(90,86,80,0.55)');
      grad.addColorStop(1, 'rgba(90,86,80,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(mx, my, mr, mr * 0.8, rand() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
    // Craters
    for (var i = 0; i < 220; i++) {
      var x = rand() * w, y = rand() * h, r = 2 + rand() * 16;
      var shade = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
      shade.addColorStop(0, 'rgba(255,255,255,0.12)');
      shade.addColorStop(0.5, 'rgba(60,56,52,0.35)');
      shade.addColorStop(1, 'rgba(60,56,52,0)');
      ctx.fillStyle = shade;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    var tex = new THREE.CanvasTexture(canvas);
    return tex;
  }

  /* ============================================================
     SUN
     ============================================================ */
  var sunGroup = new THREE.Group();
  function createSun() {
    var sunGeo = new THREE.SphereGeometry(CONFIG.sunRadius, 48, 48);
    var sunMat = new THREE.MeshBasicMaterial({ color: 0xffb35c });
    var sunMesh = new THREE.Mesh(sunGeo, sunMat);
    sunGroup.add(sunMesh);

    // Soft glow sprite
    var glowCanvas = document.createElement('canvas');
    glowCanvas.width = 512; glowCanvas.height = 512;
    var gctx = glowCanvas.getContext('2d');
    var grad = gctx.createRadialGradient(256, 256, 0, 256, 256, 256);
    grad.addColorStop(0, 'rgba(255,190,120,0.55)');
    grad.addColorStop(0.4, 'rgba(255,150,70,0.22)');
    grad.addColorStop(1, 'rgba(255,120,40,0)');
    gctx.fillStyle = grad;
    gctx.fillRect(0, 0, 512, 512);
    var glowTex = new THREE.CanvasTexture(glowCanvas);
    var glowMat = new THREE.SpriteMaterial({ map: glowTex, transparent: true, depthWrite: false });
    var glowSprite = new THREE.Sprite(glowMat);
    glowSprite.scale.set(CONFIG.sunRadius * 6, CONFIG.sunRadius * 6, 1);
    sunGroup.add(glowSprite);

    sunGroup.position.set(CONFIG.sunDistanceX, 0, 0);
    scene.add(sunGroup);
  }

  /* ============================================================
     LIGHTING — a directional light standing in for the sun,
     aimed from the sun's position at the earth. This is what
     produces the day/night terminator and moon phase shading.
     ============================================================ */
  var sunLight = new THREE.DirectionalLight(0xfff3e0, 1.35);
  var lightTarget = new THREE.Object3D();
  function createLighting() {
    sunLight.position.set(CONFIG.sunDistanceX, 0, 0);
    scene.add(lightTarget);
    sunLight.target = lightTarget;
    scene.add(sunLight);

    var ambient = new THREE.AmbientLight(0x1a2233, 1.0);
    scene.add(ambient);
  }

  /* ============================================================
     EARTH — loads the real equirectangular photo from
     images/earth-equirectangular.jpg; falls back to the
     procedural texture above if that file isn't present yet.
     ============================================================ */
  var earth;
  var textureLoader = new THREE.TextureLoader();
  function createEarth() {
    var geo = new THREE.SphereGeometry(CONFIG.earthRadius, 64, 64);
    var mat = new THREE.MeshStandardMaterial({
      map: createEarthTexture(), // procedural placeholder until the real photo loads
      roughness: 0.85,
      metalness: 0.05
    });
    earth = new THREE.Mesh(geo, mat);
    scene.add(earth);

    textureLoader.load(
      'images/earth-equirectangular.jpg',
      function (tex) {
        tex.wrapS = THREE.RepeatWrapping;
        mat.map = tex;
        mat.needsUpdate = true;
      },
      undefined,
      function () {
        console.warn('images/earth-equirectangular.jpg not found — using procedural placeholder.');
      }
    );
  }

  /* ============================================================
     MOON + ORBIT RING
     ============================================================ */
  var moon, moonPivotAngle = 0;
  function createMoon() {
    var geo = new THREE.SphereGeometry(CONFIG.moonRadius, 48, 48);
    var mat = new THREE.MeshStandardMaterial({
      map: createMoonTexture(), // procedural placeholder until the real photo loads
      roughness: 1,
      metalness: 0
    });
    moon = new THREE.Mesh(geo, mat);
    scene.add(moon);

    textureLoader.load(
      'images/moon-surface.jpg',
      function (tex) {
        mat.map = tex;
        mat.needsUpdate = true;
      },
      undefined,
      function () {
        console.warn('images/moon-surface.jpg not found — using procedural placeholder.');
      }
    );

    var ringGeo = new THREE.RingGeometry(
      CONFIG.moonOrbitRadius - 0.02, CONFIG.moonOrbitRadius + 0.02, 128
    );
    var ringMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0.12, side: THREE.DoubleSide
    });
    var ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);
  }

  /* ============================================================
     ALIGNMENT LINES — thin dotted lines from Sun→Earth and
     Earth→Moon centers. Only ever shown in the top-down view;
     visibility also respects the "Sun–Earth–Moon lines" setting.
     ============================================================ */
  var sunEarthLine, earthMoonLine;
  var isTopDownView = true;
  function createAlignmentLines() {
    var lineMat = new THREE.LineDashedMaterial({
      color: 0xffffff, transparent: true, opacity: 0.28,
      dashSize: 0.6, gapSize: 0.6
    });

    var sunEarthGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(CONFIG.sunDistanceX, 0, 0),
      new THREE.Vector3(0, 0, 0)
    ]);
    sunEarthLine = new THREE.Line(sunEarthGeo, lineMat.clone());
    sunEarthLine.computeLineDistances();
    scene.add(sunEarthLine);

    var earthMoonGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(CONFIG.moonOrbitRadius, 0, 0)
    ]);
    earthMoonLine = new THREE.Line(earthMoonGeo, lineMat.clone());
    earthMoonLine.computeLineDistances(); // valid for any rotation — endpoint distance never changes
    scene.add(earthMoonLine);

    applyLineVisibility();
  }

  function applyLineVisibility() {
    var visible = settings.lines && isTopDownView;
    sunEarthLine.visible = visible;
    earthMoonLine.visible = visible;
  }

  /* ============================================================
     PHASE / TITHI CALCULATIONS — ported from the 2D moon-phase
     explorer's logic (Gujarati tithi naming, elongation-based
     phase names).
     ============================================================ */
  var TITHI_NAMES = [
    'Ekam', 'Beej', 'Trij', 'Choth', 'Pancham',
    'Chhath', 'Satam', 'Aatham', 'Nom', 'Dasham',
    'Ekadashi', 'Baras', 'Teras', 'Chaudas'
  ];
  var PURNIMA_AMAS = ['Purnima', 'Amas']; // [15th of Sud, 15th of Vad]

  var SECTION_META = [
    { key: 'waxing-crescent', label: 'Waxing Crescent' }, // 0-90
    { key: 'waxing-gibbous', label: 'Waxing Gibbous' },   // 90-180
    { key: 'waning-gibbous', label: 'Waning Gibbous' },   // 180-270
    { key: 'waning-crescent', label: 'Waning Crescent' }  // 270-360
  ];
  var FIXED_META = {
    0: { key: 'new-moon', label: 'New Moon' },
    90: { key: 'first-quarter', label: 'First Quarter' },
    180: { key: 'full-moon', label: 'Full Moon' },
    270: { key: 'last-quarter', label: 'Last Quarter' }
  };

  function normDeg(a) { return ((a % 360) + 360) % 360; }

  function getTithi(angle) {
    if (angle === 0 || angle === 360) return { paksha: 'Vad', name: PURNIMA_AMAS[1] };
    if (angle === 180) return { paksha: 'Sud', name: PURNIMA_AMAS[0] };
    var idx = Math.floor(angle / 12) % 30;
    var paksha = idx < 15 ? 'Sud' : 'Vad';
    var pos = idx % 15;
    var name = pos < 14 ? TITHI_NAMES[pos] : (paksha === 'Sud' ? PURNIMA_AMAS[0] : PURNIMA_AMAS[1]);
    return { paksha: paksha, name: name };
  }

  function getPhase(angle) {
    if (FIXED_META[angle]) return FIXED_META[angle];
    var section = Math.floor(angle / 90);
    var local = angle - section * 90;
    var sub = Math.min(4, Math.max(1, Math.ceil(local / 22.5)));
    var meta = SECTION_META[section];
    return { key: meta.key + '-' + sub, label: meta.label };
  }

  var valAngleEl = document.getElementById('val-angle');
  var valPhaseEl = document.getElementById('val-phase');
  var valTithiEl = document.getElementById('val-tithi');

  function updatePhaseInfo(orbitAngleRad) {
    var angleDeg = normDeg(orbitAngleRad * 180 / Math.PI);
    var elongation = angleDeg <= 180 ? angleDeg : 360 - angleDeg;
    var phase = getPhase(angleDeg);
    var tithi = getTithi(angleDeg);

    valAngleEl.textContent = Math.round(elongation) + '\u00B0';
    valPhaseEl.textContent = phase.label;
    valTithiEl.textContent = tithi.paksha + ' ' + tithi.name;
  }

  /* ============================================================
     SETTINGS PANEL — visibility toggles
     ============================================================ */
  var settings = {
    lines: true,
    infoPanel: true,
    angle: true,
    phase: true,
    tithi: true
  };

  var settingsToggleBtn = document.getElementById('settings-toggle');
  var settingsPanelEl = document.getElementById('settings-panel');
  var phaseInfoPanelEl = document.getElementById('phase-info-panel');
  var toggleLines = document.getElementById('toggle-lines');
  var toggleInfoPanel = document.getElementById('toggle-info-panel');
  var toggleAngle = document.getElementById('toggle-angle');
  var togglePhase = document.getElementById('toggle-phase');
  var toggleTithi = document.getElementById('toggle-tithi');
  var angleBlockEl = phaseInfoPanelEl.querySelector('[data-info="angle"]');
  var phaseBlockEl = phaseInfoPanelEl.querySelector('[data-info="phase"]');
  var tithiBlockEl = phaseInfoPanelEl.querySelector('[data-info="tithi"]');

  function applyInfoPanelVisibility() {
    phaseInfoPanelEl.classList.toggle('hidden', !settings.infoPanel);
    angleBlockEl.classList.toggle('hidden', !settings.angle);
    phaseBlockEl.classList.toggle('hidden', !settings.phase);
    tithiBlockEl.classList.toggle('hidden', !settings.tithi);
  }

  settingsToggleBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = settingsPanelEl.classList.toggle('open');
    settingsToggleBtn.classList.toggle('active', open);
  });
  document.addEventListener('click', function (e) {
    if (!settingsPanelEl.classList.contains('open')) return;
    if (settingsPanelEl.contains(e.target) || settingsToggleBtn.contains(e.target)) return;
    settingsPanelEl.classList.remove('open');
    settingsToggleBtn.classList.remove('active');
  });

  toggleLines.addEventListener('change', function () {
    settings.lines = toggleLines.checked;
    applyLineVisibility();
  });
  toggleInfoPanel.addEventListener('change', function () {
    settings.infoPanel = toggleInfoPanel.checked;
    applyInfoPanelVisibility();
  });
  toggleAngle.addEventListener('change', function () {
    settings.angle = toggleAngle.checked;
    applyInfoPanelVisibility();
  });
  togglePhase.addEventListener('change', function () {
    settings.phase = togglePhase.checked;
    applyInfoPanelVisibility();
  });
  toggleTithi.addEventListener('change', function () {
    settings.tithi = toggleTithi.checked;
    applyInfoPanelVisibility();
  });

  function updateMoonPosition(angle) {
    moon.position.set(
      Math.cos(angle) * CONFIG.moonOrbitRadius,
      0,
      Math.sin(angle) * CONFIG.moonOrbitRadius
    );
    // Tidal lock: same face always toward Earth
    moon.up.set(0, 1, 0);
    moon.lookAt(0, 0, 0);

    // Keep the Earth→Moon dotted line's far end pinned to the moon
    if (earthMoonLine) {
      earthMoonLine.geometry.attributes.position.setXYZ(1, moon.position.x, moon.position.y, moon.position.z);
      earthMoonLine.geometry.attributes.position.needsUpdate = true;
    }

    updatePhaseInfo(angle);
  }

  /* ============================================================
     CAMERA — orbits strictly around the Sun–Earth axis (world X),
     so the Sun never drifts off-screen left/right regardless of
     the top-down / side-on toggle.
     ============================================================ */
  function updateCamera() {
    var y = CONFIG.camDistance * Math.cos(camTheta);
    var z = -CONFIG.camDistance * Math.sin(camTheta);
    camera.position.set(0, y, z);
    camera.up.set(0, Math.sin(camTheta), Math.cos(camTheta));
    camera.lookAt(0, 0, 0);
  }

  /* ============================================================
     PHASE PHOTOS — drop real images into images/, named per the
     slugs below, and they'll be picked up automatically for the
     "moon from earth" picture-in-picture. Add more interim slugs
     to this array any time; the 2π orbit range is divided evenly
     across however many entries it has. Missing files just fall
     back to the live-rendered mini camera view underneath.
     ============================================================ */
  var ORDERED_PHASE_SLUGS = [
    'new',
    'waxing-crescent-1', 'waxing-crescent-2', 'waxing-crescent-3', 'waxing-crescent-4',
    'first-quarter',
    'waxing-gibbous-1', 'waxing-gibbous-2', 'waxing-gibbous-3', 'waxing-gibbous-4',
    'full',
    'waning-gibbous-1', 'waning-gibbous-2', 'waning-gibbous-3', 'waning-gibbous-4',
    'last-quarter',
    'waning-crescent-1', 'waning-crescent-2', 'waning-crescent-3', 'waning-crescent-4'
  ];

  var pipPhotoEl = document.getElementById('pip-photo');
  var phaseImageCache = {}; // slug -> 'loaded' | 'error'
  var currentPipSlug = null;

  function slugForAngle(angle) {
    var twoPi = Math.PI * 2;
    var frac = (((angle % twoPi) + twoPi) % twoPi) / twoPi;
    var idx = Math.round(frac * ORDERED_PHASE_SLUGS.length) % ORDERED_PHASE_SLUGS.length;
    return ORDERED_PHASE_SLUGS[idx];
  }

  function updatePipPhoto(angle) {
    var slug = slugForAngle(angle);
    if (slug === currentPipSlug) return;
    currentPipSlug = slug;

    var status = phaseImageCache[slug];
    if (status === 'error') { pipPhotoEl.style.display = 'none'; return; }
    if (status === 'loaded') {
      pipPhotoEl.src = 'images/moon-' + slug + '.webp';
      pipPhotoEl.style.display = 'block';
      return;
    }
    var probe = new Image();
    probe.onload = function () {
      phaseImageCache[slug] = 'loaded';
      if (currentPipSlug === slug) {
        pipPhotoEl.src = probe.src;
        pipPhotoEl.style.display = 'block';
      }
    };
    probe.onerror = function () {
      phaseImageCache[slug] = 'error';
      if (currentPipSlug === slug) pipPhotoEl.style.display = 'none';
    };
    probe.src = 'images/moon-' + slug + '.webp';
  }

  /* ============================================================
     TIME / SCRUBBER STATE
     ============================================================ */
  var playing = false;
  var scrubberEl = document.getElementById('scrubber');
  var playToggle = document.getElementById('play-toggle');
  var iconPlay = document.getElementById('icon-play');
  var iconPause = document.getElementById('icon-pause');

  function setOrbitFromSlider(val) {
    moonPivotAngle = (val / 1000) * Math.PI * 2;
    updateMoonPosition(moonPivotAngle);
  }

  scrubberEl.addEventListener('input', function () {
    playing = false;
    iconPlay.style.display = '';
    iconPause.style.display = 'none';
    setOrbitFromSlider(parseFloat(scrubberEl.value));
  });

  playToggle.addEventListener('click', function () {
    playing = !playing;
    iconPlay.style.display = playing ? 'none' : '';
    iconPause.style.display = playing ? '' : 'none';
  });

  var btnTop = document.getElementById('btn-top');
  var btnSide = document.getElementById('btn-side');
  btnTop.addEventListener('click', function () {
    camThetaTarget = CONFIG.camThetaTopDown;
    btnTop.classList.add('active');
    btnSide.classList.remove('active');
    isTopDownView = true;
    applyLineVisibility();
  });
  btnSide.addEventListener('click', function () {
    camThetaTarget = CONFIG.camThetaSideOn;
    btnSide.classList.add('active');
    btnTop.classList.remove('active');
    isTopDownView = false;
    applyLineVisibility();
  });

  /* ============================================================
     EARTH DRAG-TO-ROTATE — grab the globe directly to spin it.
     The moon stays scrubber-only; this only ever touches Earth.
     Dragging permanently takes over from the idle auto-spin.
     ============================================================ */
  var raycaster = new THREE.Raycaster();
  var pointerNDC = new THREE.Vector2();
  var earthAutoSpin = true;
  var isDraggingEarth = false;
  var isHoveringEarth = false;
  var lastPointerX = 0;

  function setPointerNDC(clientX, clientY) {
    var rect = renderer.domElement.getBoundingClientRect();
    pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  }

  function hitsEarth(clientX, clientY) {
    setPointerNDC(clientX, clientY);
    raycaster.setFromCamera(pointerNDC, camera);
    return raycaster.intersectObject(earth).length > 0;
  }

  renderer.domElement.style.touchAction = 'none';

  renderer.domElement.addEventListener('pointerdown', function (e) {
    if (!hitsEarth(e.clientX, e.clientY)) return;
    isDraggingEarth = true;
    earthAutoSpin = false; // manual control from here on
    lastPointerX = e.clientX;
    renderer.domElement.setPointerCapture(e.pointerId);
    renderer.domElement.style.cursor = 'grabbing';
  });

  renderer.domElement.addEventListener('pointermove', function (e) {
    if (isDraggingEarth) {
      var deltaX = e.clientX - lastPointerX;
      lastPointerX = e.clientX;
      earth.rotation.y += deltaX * CONFIG.earthDragSensitivity;
      return;
    }
    var hovering = hitsEarth(e.clientX, e.clientY);
    if (hovering !== isHoveringEarth) {
      isHoveringEarth = hovering;
      renderer.domElement.style.cursor = hovering ? 'grab' : 'default';
    }
  });

  function endEarthDrag(e) {
    if (!isDraggingEarth) return;
    isDraggingEarth = false;
    renderer.domElement.style.cursor = isHoveringEarth ? 'grab' : 'default';
  }
  renderer.domElement.addEventListener('pointerup', endEarthDrag);
  renderer.domElement.addEventListener('pointercancel', endEarthDrag);

  /* ============================================================
     RESIZE
     ============================================================ */
  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);

    var pipRect = pipCanvas.getBoundingClientRect();
    var size = Math.max(1, Math.round(pipRect.width));
    pipRenderer.setSize(size, size, false);
  }
  window.addEventListener('resize', onResize);

  /* ============================================================
     INIT
     ============================================================ */
  createStarfield();
  createSun();
  createLighting();
  createEarth();
  createMoon();
  createAlignmentLines();
  updateCamera();
  updateMoonPosition(0);
  applyInfoPanelVisibility();
  onResize();

  /* ============================================================
     ANIMATE
     ============================================================ */
  var lastTime = performance.now();

  function animate(now) {
    requestAnimationFrame(animate);
    var dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    // Earth's own axial spin — on by default, hands off permanently once dragged
    if (earthAutoSpin) {
      earth.rotation.y += CONFIG.earthAxialSpinSpeed * dt;
    }

    // Auto-play advances the moon's orbital position
    if (playing) {
      moonPivotAngle += (Math.PI * 2 / CONFIG.orbitCycleSeconds) * dt;
      if (moonPivotAngle > Math.PI * 2) moonPivotAngle -= Math.PI * 2;
      updateMoonPosition(moonPivotAngle);
      scrubberEl.value = Math.round((moonPivotAngle / (Math.PI * 2)) * 1000);
    }

    // Smooth camera tween between top-down and side-on
    camTheta += (camThetaTarget - camTheta) * Math.min(CONFIG.camTweenSpeed * dt, 1);
    updateCamera();

    renderer.render(scene, camera);

    // Picture-in-picture: prefer a real phase photo; fall back to the live render
    updatePipPhoto(moonPivotAngle);
    if (pipPhotoEl.style.display !== 'block') {
      pipCamera.position.set(0, 0, 0);
      pipCamera.up.set(0, 1, 0);
      pipCamera.lookAt(moon.position);
      pipRenderer.render(scene, pipCamera);
    }
  }

  requestAnimationFrame(animate);

  var loadingEl = document.getElementById('loading');
  requestAnimationFrame(function () {
    loadingEl.classList.add('hidden');
  });
})();
</script>
</body>
</html>
