<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Moon Phase Viewer</title>
<link rel="preconnect" href="https://timepusdi.vercel.app">
<style>
    :root{
        color-scheme: dark;
    }
    *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    body{
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Work Sans', sans-serif;
        background:#000;
        min-height:100dvh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
    }

    .card{
        width:100%;
        max-width:420px;
        min-height:100dvh;
        background:#000;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
        align-items:center;
        padding:28px 20px;
        position:relative;
    }

    /* ----- top text block ----- */
    .top-text{
        text-align:center;
        color:#fff;
    }
    .tithi-line{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
    }
    .nav-btn{
        background:none;
        border:none;
        color:rgba(255,255,255,0.35);
        font-size:20px;
        line-height:1;
        padding:6px 10px;
        cursor:pointer;
        transition:color .2s;
    }
    .nav-btn:hover, .nav-btn:active{ color:rgba(255,255,255,0.9); }

    .gujarati-date{
        font-size:1.55rem;
        font-weight:500;
        letter-spacing:0.2px;
    }
    .phase-line{
        margin-top:10px;
        font-size:1.25rem;
        font-weight:400;
        color:rgba(255,255,255,0.8);
    }
    .today-label{
        margin-top:6px;
        font-size:0.8rem;
        color:rgba(255,255,255,0.35);
        letter-spacing:0.5px;
        min-height:1em;
    }

    /* ----- moon ----- */
    .moon-wrap{
        width:100%;
        max-width:396px;
        aspect-ratio:1/1;
        border-radius:50%;
        position:relative;
        display:flex;
        align-items:center;
        justify-content:center;
        overflow:hidden;
        background:radial-gradient(circle at 38% 35%, #2a2a2a 0%, #050505 72%);
        box-shadow:0 0 60px rgba(255,255,255,0.05) inset;
        cursor:pointer;
    }
    .moon-img{
        width:100%;
        height:100%;
        object-fit:cover;
        display:none;
        transition:opacity 0.25s ease;
    }
    /* CSS fallback moon, used only if both image sources fail */
    .moon-css{
        width:88%;
        height:88%;
        border-radius:50%;
        background:#1c1c1c;
        position:relative;
        overflow:hidden;
        display:none;
    }
    .moon-css.active{ display:block; }
    .moon-light{
        position:absolute;
        top:0;
        height:100%;
        background:#eae6da;
        border-radius:50%;
    }

    /* ----- bottom text block ----- */
    .bottom-text{
        width:100%;
        text-align:center;
        color:#fff;
    }
    .upcoming-row{ margin-bottom:14px; }
    .upcoming-row:last-child{ margin-bottom:0; }
    .upcoming-label{
        font-size:0.85rem;
        color:rgba(255,255,255,0.45);
        margin-bottom:4px;
    }
    .upcoming-date{
        font-size:1.2rem;
        font-weight:600;
    }

    /* ----- fullscreen image view ----- */
    .image-modal{
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,0.92);
        align-items:center;
        justify-content:center;
        z-index:999;
    }
    .image-modal.active{ display:flex; }
    .image-modal img{ max-width:92%; max-height:92%; border-radius:8px; }
    .modal-close{
        position:absolute;
        top:24px; right:24px;
        font-size:32px;
        color:#fff;
        cursor:pointer;
        font-weight:300;
    }

    .error-note{
        position:absolute;
        bottom:6px;
        left:0; right:0;
        text-align:center;
        font-size:0.7rem;
        color:rgba(255,255,255,0.25);
    }
</style>
</head>
<body>

<div class="card">

    <div class="top-text">
        <div class="tithi-line">
            <button class="nav-btn" onclick="shiftDate(-1)" aria-label="Previous day">‹</button>
            <div class="gujarati-date" id="gujaratiDate">Loading…</div>
            <button class="nav-btn" onclick="shiftDate(1)" aria-label="Next day">›</button>
        </div>
        <div class="phase-line" id="phaseLine">&nbsp;</div>
        <div class="today-label" id="todayLabel"></div>
    </div>

    <div class="moon-wrap" id="moonWrap" onclick="openImageModal()">
        <img class="moon-img" id="moonImage" alt="Moon phase">
        <div class="moon-css" id="moonCss"><div class="moon-light" id="moonLight"></div></div>
    </div>

    <div class="bottom-text">
        <div class="upcoming-row">
            <div class="upcoming-label" id="phase1Label">next full moon</div>
            <div class="upcoming-date" id="phase1Date">Loading…</div>
        </div>
        <div class="upcoming-row">
            <div class="upcoming-label" id="phase2Label">next new moon</div>
            <div class="upcoming-date" id="phase2Date">Loading…</div>
        </div>
    </div>

    <div class="error-note" id="errorNote"></div>
</div>

<div class="image-modal" id="imageModal" onclick="closeImageModal(event)">
    <span class="modal-close" onclick="closeImageModal()">&times;</span>
    <img id="modalImage" alt="Moon phase, full view">
</div>

<script>
/* =========================================================
   GUJARATI TITHI DATA
   Each month gives explicit sudPadvo (= Sud Ekam), fullMoon and
   newMoon dates. Explicit dates always win over the calculated
   count: the full-moon date is always Purnima, the new-moon date
   is always Amas, regardless of how many days the count would
   otherwise land on.
   NOTE: this table only covers Chaitra 2026 – Fagan 2027.
   Extend LUNAR_DATA.months each year, or swap in an algorithmic
   panchang calc long-term.
========================================================= */
const LUNAR_DATA = {
    months: [
        { name: "Chaitra", year: 2026, sudPadvo: "2026-03-19", fullMoon: "2026-04-02", newMoon: "2026-04-17" },
        { name: "Vaishakh", year: 2026, sudPadvo: "2026-04-18", fullMoon: "2026-05-01", newMoon: "2026-05-16" },
        { name: "Adhik Jyeshta", year: 2026, sudPadvo: "2026-05-17", fullMoon: "2026-05-31", newMoon: "2026-06-15" },
        { name: "Jyeshta", year: 2026, sudPadvo: "2026-06-15", fullMoon: "2026-06-29", newMoon: "2026-07-14" },
        { name: "Ashadh", year: 2026, sudPadvo: "2026-07-15", fullMoon: "2026-07-29", newMoon: "2026-08-12" },
        { name: "Shravan", year: 2026, sudPadvo: "2026-08-13", fullMoon: "2026-08-28", newMoon: "2026-09-11" },
        { name: "Bhadarvo", year: 2026, sudPadvo: "2026-09-12", fullMoon: "2026-09-26", newMoon: "2026-10-10" },
        { name: "Ashwin", year: 2026, sudPadvo: "2026-10-11", fullMoon: "2026-10-26", newMoon: "2026-11-09" },
        { name: "Kartik", year: 2026, sudPadvo: "2026-11-10", fullMoon: "2026-11-22", newMoon: "2026-12-08" },
        { name: "Magshar", year: 2026, sudPadvo: "2026-12-09", fullMoon: "2026-12-23", newMoon: "2027-01-07" },
        { name: "Posh", year: 2027, sudPadvo: "2027-01-08", fullMoon: "2027-01-22", newMoon: "2027-02-06" },
        { name: "Maha", year: 2027, sudPadvo: "2027-02-07", fullMoon: "2027-02-20", newMoon: "2027-03-08" },
        { name: "Fagan", year: 2027, sudPadvo: "2027-03-09", fullMoon: "2027-03-22", newMoon: "2027-04-06" }
    ]
};
const TITHI_NAMES = [
    "Ekam", "Beej", "Trij", "Choth", "Pancham",
    "Chhath", "Satam", "Aatham", "Nom", "Dasham",
    "Ekadashi", "Baras", "Teras", "Chaudas", "Jam"
];
const PURNIMA_AMAS = ["Purnima", "Amas"];

let currentDate = new Date();
let renderToken = 0;

function dateOnly(date) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function daysBetween(from, to) {
    return Math.round((dateOnly(to) - dateOnly(from)) / 86400000);
}

function calculateLunarInfo(date) {
    const target = dateOnly(date);

    // Find the lunar month whose Sud Padvo starts on/before the date.
    let currentMonth = null;
    for (const month of LUNAR_DATA.months) {
        const sudPadvo = new Date(month.sudPadvo);
        if (target >= sudPadvo) currentMonth = month;
        else break;
    }

    if (!currentMonth) {
        currentMonth = LUNAR_DATA.months[0];
    }

    const sudPadvo = dateOnly(new Date(currentMonth.sudPadvo));
    const fullMoon = currentMonth.fullMoon ? dateOnly(new Date(currentMonth.fullMoon)) : null;
    const newMoon = currentMonth.newMoon ? dateOnly(new Date(currentMonth.newMoon)) : null;

    let isShukla = true;
    let tithiNumber;

    if (fullMoon && target >= fullMoon) {
        if (target.getTime() === fullMoon.getTime()) {
            // Explicit full-moon date always wins.
            isShukla = true;
            tithiNumber = 14;
        } else if (newMoon && target >= newMoon) {
            // Explicit new-moon date always wins.
            isShukla = false;
            tithiNumber = 14;
        } else {
            // Start Vad Ekam on the day after Purnima and count forward.
            isShukla = false;
            tithiNumber = Math.min(daysBetween(fullMoon, target) - 1, 14);
        }
    } else {
        // Sud Padvo is explicitly Sud Ekam; each following date advances
        // one tithi. The explicit full-moon date overrides this calculation.
        isShukla = true;
        tithiNumber = Math.min(daysBetween(sudPadvo, target), 14);
    }

    let tithiName = TITHI_NAMES[tithiNumber];
    if (tithiNumber === 14) {
        tithiName = isShukla ? PURNIMA_AMAS[0] : PURNIMA_AMAS[1];
    }

    return { month: currentMonth, isShukla, tithiName };
}

function getUpcomingMoonPhases(fromDate) {
    let nextNewMoon = null, nextFullMoon = null;
    for (const month of LUNAR_DATA.months) {
        const newMoonDate = new Date(month.newMoon);
        const fullMoonDate = new Date(month.fullMoon);
        if (newMoonDate > fromDate && !nextNewMoon) nextNewMoon = { type: "newMoon", date: newMoonDate };
        if (fullMoonDate > fromDate && !nextFullMoon) nextFullMoon = { type: "fullMoon", date: fullMoonDate };
        if (nextNewMoon && nextFullMoon) break;
    }
    return [nextNewMoon, nextFullMoon].filter(Boolean).sort((a, b) => a.date - b.date);
}

/* =========================================================
   MOON PHASE + ILLUMINATION
   Calculated independently from a known reference new moon
   (2000-01-06 18:14 UTC) using the synodic month length, so
   it keeps working correctly beyond the LUNAR_DATA table's
   2027 cutoff, with no hardcoded date range.
========================================================= */
const SYNODIC_MONTH = 29.530588853;
const REFERENCE_NEW_MOON = Date.UTC(2000, 0, 6, 18, 14, 0);

function getMoonAge(date) {
    const daysSince = (date.getTime() - REFERENCE_NEW_MOON) / 86400000;
    let age = daysSince % SYNODIC_MONTH;
    if (age < 0) age += SYNODIC_MONTH;
    return age; // 0 - 29.53
}

function getIlluminationPercent(age) {
    const fraction = age / SYNODIC_MONTH;
    const illum = (1 - Math.cos(2 * Math.PI * fraction)) / 2;
    return Math.round(illum * 1000) / 10; // one decimal place
}

function getPhaseName(age) {
    const m = SYNODIC_MONTH;
    if (age < m * 0.0625 || age > m * 0.9375) return "New Moon";
    if (age < m * 0.1875) return "Waxing Crescent";
    if (age < m * 0.3125) return "First Quarter";
    if (age < m * 0.4375) return "Waxing Gibbous";
    if (age < m * 0.5625) return "Full Moon";
    if (age < m * 0.6875) return "Waning Gibbous";
    if (age < m * 0.8125) return "Last Quarter";
    return "Waning Crescent";
}

/* Local WebP placeholder, at finer resolution (28 slices) than the 8-name
   text label above, so the placeholder more closely tracks the real
   photo's terminator position while it loads.
   The cycle is divided into 28 equal-width slices in a fixed order: the
   four instantaneous phases (new, first quarter, full, last quarter) get
   one slice each, and the four gradual phases (waxing/waning crescent,
   waxing/waning gibbous) get six sub-steps each — 4 + 4×6 = 28. Given
   the current moon age, we pick whichever of the 28 slices is closest.
   Drop matching files in an /images folder next to this HTML file, named:
     moon-new.webp
     moon-waxing-crescent-1.webp ... moon-waxing-crescent-6.webp
     moon-first-quarter.webp
     moon-waxing-gibbous-1.webp ... moon-waxing-gibbous-6.webp
     moon-full.webp
     moon-waning-gibbous-1.webp ... moon-waning-gibbous-6.webp
     moon-last-quarter.webp
     moon-waning-crescent-1.webp ... moon-waning-crescent-6.webp
   These are optional — if a file isn't there, it fails over to the
   CSS-drawn moon below, same as before — nothing breaks if you haven't
   added them yet. */
const ORDERED_PHASE_SLUGS = [
    'new',
    'waxing-crescent-1', 'waxing-crescent-2', 'waxing-crescent-3',
    'waxing-crescent-4', 'waxing-crescent-5', 'waxing-crescent-6',
    'first-quarter',
    'waxing-gibbous-1', 'waxing-gibbous-2', 'waxing-gibbous-3',
    'waxing-gibbous-4', 'waxing-gibbous-5', 'waxing-gibbous-6',
    'full',
    'waning-gibbous-1', 'waning-gibbous-2', 'waning-gibbous-3',
    'waning-gibbous-4', 'waning-gibbous-5', 'waning-gibbous-6',
    'last-quarter',
    'waning-crescent-1', 'waning-crescent-2', 'waning-crescent-3',
    'waning-crescent-4', 'waning-crescent-5', 'waning-crescent-6'
];
function localPhaseImagePath(age) {
    const fraction = age / SYNODIC_MONTH; // 0 (new) .. 1 (back to new)
    const index = Math.round(fraction * ORDERED_PHASE_SLUGS.length) % ORDERED_PHASE_SLUGS.length;
    return `images/moon-${ORDERED_PHASE_SLUGS[index]}.webp`;
}

/* =========================================================
   MOON IMAGE
   Source: your Vercel proxy in front of NASA SVS "Dial-A-Moon"
   imagery. A direct browser call to svs.gsfc.nasa.gov was tried
   first originally, but NASA's API sends a fixed
   Access-Control-Allow-Origin (locked to their own demo site),
   so a direct cross-origin fetch is rejected by every browser
   from any other origin — it's not an intermittent issue, it
   can never succeed from GitHub Pages, so calling it first only
   cost a failed round trip (and a console error) on every load.
   Going straight to the proxy is both faster and quieter.
   Last resort if the proxy is unreachable: CSS-drawn crescent/
   gibbous shape.
========================================================= */
const imageCache = {};
const CACHE_PREFIX = 'moonImg:';

function readCache(key) {
    if (imageCache[key]) return imageCache[key];
    try {
        const stored = sessionStorage.getItem(CACHE_PREFIX + key);
        if (stored) { imageCache[key] = stored; return stored; }
    } catch (e) { /* sessionStorage unavailable (e.g. privacy mode) — ignore */ }
    return null;
}

function writeCache(key, url) {
    imageCache[key] = url;
    try { sessionStorage.setItem(CACHE_PREFIX + key, url); } catch (e) { /* ignore */ }
}

async function fetchMoonImageUrl(date) {
    const key = date.toISOString().slice(0, 13); // cache per hour
    const cached = readCache(key);
    if (cached) return cached;

    try {
        const res = await fetch(`https://timepusdi.vercel.app/api/moon?date=${date.toISOString()}`);
        if (res.ok) {
            const data = await res.json();
            if (data && data.image) {
                writeCache(key, data.image);
                return data.image;
            }
        }
    } catch (e) { /* fall through to CSS moon */ }

    return null;
}

function updateCssMoon(age) {
    const light = document.getElementById('moonLight');
    const fraction = age / SYNODIC_MONTH;
    if (fraction <= 0.5) {
        const percent = fraction * 2 * 100;
        light.style.width = percent + '%';
        light.style.right = '0'; light.style.left = 'auto';
    } else {
        const percent = (1 - fraction) * 2 * 100;
        light.style.width = percent + '%';
        light.style.left = '0'; light.style.right = 'auto';
    }
}

/* ========================================================= */

async function render(date) {
    // Tithi + upcoming phases
    const lunarInfo = calculateLunarInfo(date);
    const isPurnimaOrAmas = lunarInfo.tithiName === 'Purnima' || lunarInfo.tithiName === 'Amas';
    document.getElementById('gujaratiDate').textContent = isPurnimaOrAmas
        ? `${lunarInfo.month.name} ${lunarInfo.tithiName}`
        : `${lunarInfo.month.name} ${lunarInfo.isShukla ? 'Sud' : 'Vad'} ${lunarInfo.tithiName}`;

    const upcoming = getUpcomingMoonPhases(date);
    const labels = { newMoon: 'next new moon', fullMoon: 'next full moon' };
    const dateOpts = { month: 'long', day: 'numeric', weekday: 'long' };
    if (upcoming[0]) {
        document.getElementById('phase1Label').textContent = labels[upcoming[0].type];
        document.getElementById('phase1Date').textContent = upcoming[0].date.toLocaleDateString('en-US', dateOpts);
    }
    if (upcoming[1]) {
        document.getElementById('phase2Label').textContent = labels[upcoming[1].type];
        document.getElementById('phase2Date').textContent = upcoming[1].date.toLocaleDateString('en-US', dateOpts);
    }

    // Phase name + illumination
    const age = getMoonAge(date);
    const illum = getIlluminationPercent(age);
    const phaseName = getPhaseName(age);
    document.getElementById('phaseLine').textContent = `${phaseName} ${illum}%`;

    const today = new Date(); today.setHours(0,0,0,0);
    const compareDate = new Date(date); compareDate.setHours(0,0,0,0);
    const todayLabel = document.getElementById('todayLabel');
    if (compareDate.getTime() === today.getTime()) todayLabel.textContent = '';
    else todayLabel.textContent = date.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });

    // Moon image — show a local phase placeholder instantly (no network
    // wait), then swap in the real photo for this exact date once it
    // arrives. renderToken guards against a slow response from an older
    // date landing after a newer one if the person taps ‹ › quickly.
    const token = ++renderToken;
    const moonImage = document.getElementById('moonImage');
    const moonCss = document.getElementById('moonCss');
    moonCss.classList.remove('active');
    document.getElementById('errorNote').textContent = '';

    moonImage.style.opacity = '1';
    moonImage.onload = () => { moonImage.style.display = 'block'; };
    moonImage.onerror = () => {
        if (token !== renderToken) return;
        moonImage.style.display = 'none';
        moonCss.classList.add('active');
        updateCssMoon(age);
    };
    moonImage.src = localPhaseImagePath(age);

    fetchMoonImageUrl(date).then(url => {
        if (!url || token !== renderToken) return; // stale or unavailable — keep current placeholder
        const preload = new Image();
        preload.onload = () => {
            if (token !== renderToken) return;
            moonCss.classList.remove('active');
            moonImage.style.opacity = '0.4';
            moonImage.onerror = null; // this URL is already confirmed to load
            moonImage.onload = () => {
                moonImage.style.display = 'block';
                moonImage.style.opacity = '1';
            };
            moonImage.src = url;
        };
        preload.src = url;
    });
}

function shiftDate(days) {
    currentDate.setDate(currentDate.getDate() + days);
    render(currentDate);
}

function openImageModal() {
    const moonImage = document.getElementById('moonImage');
    if (moonImage.style.display === 'none' || !moonImage.src) return;
    document.getElementById('modalImage').src = moonImage.src;
    document.getElementById('imageModal').classList.add('active');
}
function closeImageModal(event) {
    if (!event || event.target.id === 'imageModal' || event.target.classList.contains('modal-close')) {
        document.getElementById('imageModal').classList.remove('active');
    }
}

render(currentDate);
</script>
</body>
</html>
