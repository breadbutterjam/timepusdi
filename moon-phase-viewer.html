<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Moon Phase Viewer</title>
<style>
    :root{
        color-scheme: dark;
    }
    *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    body{
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Work Sans', sans-serif;
        background:#000;
        min-height:100dvh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
    }

    .card{
        width:100%;
        max-width:420px;
        min-height:100dvh;
        background:#000;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
        align-items:center;
        padding:28px 20px;
        position:relative;
    }

    /* ----- top text block ----- */
    .top-text{
        text-align:center;
        color:#fff;
    }
    .tithi-line{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
    }
    .nav-btn{
        background:none;
        border:none;
        color:rgba(255,255,255,0.35);
        font-size:20px;
        line-height:1;
        padding:6px 10px;
        cursor:pointer;
        transition:color .2s;
    }
    .nav-btn:hover, .nav-btn:active{ color:rgba(255,255,255,0.9); }

    .gujarati-date{
        font-size:1.55rem;
        font-weight:500;
        letter-spacing:0.2px;
    }
    .phase-line{
        margin-top:10px;
        font-size:1.25rem;
        font-weight:400;
        color:rgba(255,255,255,0.8);
    }
    .today-label{
        margin-top:6px;
        font-size:0.8rem;
        color:rgba(255,255,255,0.35);
        letter-spacing:0.5px;
        min-height:1em;
    }

    /* ----- moon ----- */
    .moon-wrap{
        width:100%;
        max-width:396px;
        aspect-ratio:1/1;
        border-radius:50%;
        position:relative;
        display:flex;
        align-items:center;
        justify-content:center;
        overflow:hidden;
        background:radial-gradient(circle at 38% 35%, #2a2a2a 0%, #050505 72%);
        box-shadow:0 0 60px rgba(255,255,255,0.05) inset;
        cursor:pointer;
    }
    .moon-img{
        width:100%;
        height:100%;
        object-fit:cover;
        display:none;
    }
    /* CSS fallback moon, used only if both image sources fail */
    .moon-css{
        width:88%;
        height:88%;
        border-radius:50%;
        background:#1c1c1c;
        position:relative;
        overflow:hidden;
        display:none;
    }
    .moon-css.active{ display:block; }
    .moon-light{
        position:absolute;
        top:0;
        height:100%;
        background:#eae6da;
        border-radius:50%;
    }
    .spinner{
        position:absolute;
        width:34px;
        height:34px;
        border-radius:50%;
        border:2px solid rgba(255,255,255,0.15);
        border-top-color:rgba(255,255,255,0.6);
        animation:spin 0.9s linear infinite;
        display:none;
    }
    .spinner.active{ display:block; }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    /* ----- bottom text block ----- */
    .bottom-text{
        width:100%;
        text-align:center;
        color:#fff;
    }
    .upcoming-row{ margin-bottom:14px; }
    .upcoming-row:last-child{ margin-bottom:0; }
    .upcoming-label{
        font-size:0.85rem;
        color:rgba(255,255,255,0.45);
        margin-bottom:4px;
    }
    .upcoming-date{
        font-size:1.2rem;
        font-weight:600;
    }

    /* ----- fullscreen image view ----- */
    .image-modal{
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,0.92);
        align-items:center;
        justify-content:center;
        z-index:999;
    }
    .image-modal.active{ display:flex; }
    .image-modal img{ max-width:92%; max-height:92%; border-radius:8px; }
    .modal-close{
        position:absolute;
        top:24px; right:24px;
        font-size:32px;
        color:#fff;
        cursor:pointer;
        font-weight:300;
    }

    .error-note{
        position:absolute;
        bottom:6px;
        left:0; right:0;
        text-align:center;
        font-size:0.7rem;
        color:rgba(255,255,255,0.25);
    }
</style>
</head>
<body>

<div class="card">

    <div class="top-text">
        <div class="tithi-line">
            <button class="nav-btn" onclick="shiftDate(-1)" aria-label="Previous day">‹</button>
            <div class="gujarati-date" id="gujaratiDate">Loading…</div>
            <button class="nav-btn" onclick="shiftDate(1)" aria-label="Next day">›</button>
        </div>
        <div class="phase-line" id="phaseLine">&nbsp;</div>
        <div class="today-label" id="todayLabel"></div>
    </div>

    <div class="moon-wrap" id="moonWrap" onclick="openImageModal()">
        <div class="spinner" id="spinner"></div>
        <img class="moon-img" id="moonImage" alt="Moon phase">
        <div class="moon-css" id="moonCss"><div class="moon-light" id="moonLight"></div></div>
    </div>

    <div class="bottom-text">
        <div class="upcoming-row">
            <div class="upcoming-label" id="phase1Label">next full moon</div>
            <div class="upcoming-date" id="phase1Date">Loading…</div>
        </div>
        <div class="upcoming-row">
            <div class="upcoming-label" id="phase2Label">next new moon</div>
            <div class="upcoming-date" id="phase2Date">Loading…</div>
        </div>
    </div>

    <div class="error-note" id="errorNote"></div>
</div>

<div class="image-modal" id="imageModal" onclick="closeImageModal(event)">
    <span class="modal-close" onclick="closeImageModal()">&times;</span>
    <img id="modalImage" alt="Moon phase, full view">
</div>

<script>
/* =========================================================
   GUJARATI TITHI DATA
   — copied from the existing gujarati-calendar.html so the
     tithi/paksha text matches that tool exactly.
   NOTE: this table only covers Chaitra 2026 – Fagan 2027.
   Extend LUNAR_DATA.months (and .festivals, if reused) each
   year, or swap in an algorithmic panchang calc long-term.
========================================================= */
const LUNAR_DATA = {
    months: [
        { name: "Chaitra", year: 2026, newMoon: "2026-03-19", fullMoon: "2026-04-02" },
        { name: "Vaishakh", year: 2026, newMoon: "2026-04-17", fullMoon: "2026-05-01" },
        { name: "Adhik Jyeshtha", year: 2026, newMoon: "2026-05-16", fullMoon: "2026-05-31" },
        { name: "Jyeshtha", year: 2026, newMoon: "2026-06-15", fullMoon: "2026-06-30" },
        { name: "Ashadh", year: 2026, newMoon: "2026-07-14", fullMoon: "2026-07-29" },
        { name: "Shravan", year: 2026, newMoon: "2026-08-12", fullMoon: "2026-08-28" },
        { name: "Bhadrapad", year: 2026, newMoon: "2026-09-11", fullMoon: "2026-09-26" },
        { name: "Ashwin", year: 2026, newMoon: "2026-10-10", fullMoon: "2026-10-26" },
        { name: "Kartik", year: 2026, newMoon: "2026-11-09", fullMoon: "2026-11-24" },
        { name: "Magshar", year: 2026, newMoon: "2026-12-09", fullMoon: "2026-12-24" },
        { name: "Posh", year: 2027, newMoon: "2027-01-07", fullMoon: "2027-01-22" },
        { name: "Maha", year: 2027, newMoon: "2027-02-06", fullMoon: "2027-02-20" },
        { name: "Fagan", year: 2027, newMoon: "2027-03-08", fullMoon: "2027-03-22" }
    ]
};
const TITHI_NAMES = [
    "Ekam", "Beej", "Trij", "Choth", "Pancham",
    "Chhath", "Satam", "Aatham", "Nom", "Dasham",
    "Ekadashi", "Baras", "Teras", "Chaudas", "Jam"
];
const PURNIMA_AMAS = ["Purnima", "Amas"];

let currentDate = new Date();

function calculateLunarInfo(date) {
    let currentMonth = null, isShukla = true, dayInPaksha = 0;

    for (let i = 0; i < LUNAR_DATA.months.length; i++) {
        const month = LUNAR_DATA.months[i];
        const newMoon = new Date(month.newMoon);
        const fullMoon = new Date(month.fullMoon);

        if (date >= newMoon && date <= fullMoon) {
            currentMonth = month; isShukla = true;
            // Count backwards from the full moon (mirrors the Vad/Amas fix) so
            // the full moon day always lands on tithi 14 (Purnima), instead of
            // counting forward from the new moon, which could overshoot and
            // duplicate Purnima across two days when this paksha runs longer
            // than 15 days.
            const daysFromEnd = Math.floor((fullMoon - date) / 86400000);
            dayInPaksha = Math.max(0, 14 - daysFromEnd);
            break;
        } else if (i < LUNAR_DATA.months.length - 1) {
            const nextNewMoon = new Date(LUNAR_DATA.months[i + 1].newMoon);
            if (date > fullMoon && date < nextNewMoon) {
                currentMonth = month; isShukla = false;
                // Count backwards from the upcoming new moon so the day right
                // before it always lands on tithi 14 (Amas), instead of counting
                // forward from the full moon, which could run out of days before
                // reaching Amas and jump straight to next month's Sud Ekam.
                const daysFromEnd = Math.floor((nextNewMoon - date) / 86400000) - 1;
                dayInPaksha = Math.max(0, 14 - daysFromEnd);
                break;
            }
        }
    }
    if (!currentMonth) { currentMonth = LUNAR_DATA.months[0]; isShukla = true; dayInPaksha = 0; }

    const tithiNumber = Math.min(dayInPaksha, 14);
    let tithiName = TITHI_NAMES[tithiNumber];
    if (tithiNumber === 14) tithiName = isShukla ? PURNIMA_AMAS[0] : PURNIMA_AMAS[1];

    return { month: currentMonth, isShukla, tithiName };
}

function getUpcomingMoonPhases(fromDate) {
    let nextNewMoon = null, nextFullMoon = null;
    for (const month of LUNAR_DATA.months) {
        const newMoonDate = new Date(month.newMoon);
        const fullMoonDate = new Date(month.fullMoon);
        if (newMoonDate > fromDate && !nextNewMoon) nextNewMoon = { type: "newMoon", date: newMoonDate };
        if (fullMoonDate > fromDate && !nextFullMoon) nextFullMoon = { type: "fullMoon", date: fullMoonDate };
        if (nextNewMoon && nextFullMoon) break;
    }
    return [nextNewMoon, nextFullMoon].filter(Boolean).sort((a, b) => a.date - b.date);
}

/* =========================================================
   MOON PHASE + ILLUMINATION
   Calculated independently from a known reference new moon
   (2000-01-06 18:14 UTC) using the synodic month length, so
   it keeps working correctly beyond the LUNAR_DATA table's
   2027 cutoff, with no hardcoded date range.
========================================================= */
const SYNODIC_MONTH = 29.530588853;
const REFERENCE_NEW_MOON = Date.UTC(2000, 0, 6, 18, 14, 0);

function getMoonAge(date) {
    const daysSince = (date.getTime() - REFERENCE_NEW_MOON) / 86400000;
    let age = daysSince % SYNODIC_MONTH;
    if (age < 0) age += SYNODIC_MONTH;
    return age; // 0 - 29.53
}

function getIlluminationPercent(age) {
    const fraction = age / SYNODIC_MONTH;
    const illum = (1 - Math.cos(2 * Math.PI * fraction)) / 2;
    return Math.round(illum * 1000) / 10; // one decimal place
}

function getPhaseName(age) {
    const m = SYNODIC_MONTH;
    if (age < m * 0.0625 || age > m * 0.9375) return "New Moon";
    if (age < m * 0.1875) return "Waxing Crescent";
    if (age < m * 0.3125) return "First Quarter";
    if (age < m * 0.4375) return "Waxing Gibbous";
    if (age < m * 0.5625) return "Full Moon";
    if (age < m * 0.6875) return "Waning Gibbous";
    if (age < m * 0.8125) return "Last Quarter";
    return "Waning Crescent";
}

/* =========================================================
   MOON IMAGE
   Primary: NASA SVS "Dial-A-Moon" API (official NASA/GSFC
   imagery, rendered for the exact date/time requested).
   Fallback: the existing Vercel proxy in front of the same
   NASA source (kept as a safety net — direct browser fetches
   to nasa.gov can hit CORS in some environments).
   Last resort: CSS-drawn crescent/gibbous shape.
========================================================= */
const imageCache = {};

async function fetchMoonImageUrl(date) {
    const key = date.toISOString().slice(0, 13); // cache per hour
    if (imageCache[key]) return imageCache[key];

    const isoForApi = date.toISOString().slice(0, 16);

    // 1. NASA Dial-A-Moon, direct
    try {
        const res = await fetch(`https://svs.gsfc.nasa.gov/api/dialamoon/${isoForApi}`);
        if (res.ok) {
            const data = await res.json();
            if (data && data.image && data.image.url) {
                imageCache[key] = data.image.url;
                return data.image.url;
            }
        }
    } catch (e) { /* fall through */ }

    // 2. Vercel proxy in front of the same NASA source
    try {
        const res = await fetch(`https://timepusdi.vercel.app/api/moon?date=${date.toISOString()}`);
        if (res.ok) {
            const data = await res.json();
            if (data && data.image) {
                imageCache[key] = data.image;
                return data.image;
            }
        }
    } catch (e) { /* fall through */ }

    return null;
}

function updateCssMoon(age) {
    const light = document.getElementById('moonLight');
    const fraction = age / SYNODIC_MONTH;
    if (fraction <= 0.5) {
        const percent = fraction * 2 * 100;
        light.style.width = percent + '%';
        light.style.right = '0'; light.style.left = 'auto';
    } else {
        const percent = (1 - fraction) * 2 * 100;
        light.style.width = percent + '%';
        light.style.left = '0'; light.style.right = 'auto';
    }
}

/* ========================================================= */

async function render(date) {
    document.getElementById('errorNote').textContent = '';

    // Tithi + upcoming phases
    const lunarInfo = calculateLunarInfo(date);
    const isPurnimaOrAmas = lunarInfo.tithiName === 'Purnima' || lunarInfo.tithiName === 'Amas';
    document.getElementById('gujaratiDate').textContent = isPurnimaOrAmas
        ? `${lunarInfo.month.name} ${lunarInfo.tithiName}`
        : `${lunarInfo.month.name} ${lunarInfo.isShukla ? 'Sud' : 'Vad'} ${lunarInfo.tithiName}`;

    const upcoming = getUpcomingMoonPhases(date);
    const labels = { newMoon: 'next new moon', fullMoon: 'next full moon' };
    const dateOpts = { month: 'long', day: 'numeric', weekday: 'long' };
    if (upcoming[0]) {
        document.getElementById('phase1Label').textContent = labels[upcoming[0].type];
        document.getElementById('phase1Date').textContent = upcoming[0].date.toLocaleDateString('en-US', dateOpts);
    }
    if (upcoming[1]) {
        document.getElementById('phase2Label').textContent = labels[upcoming[1].type];
        document.getElementById('phase2Date').textContent = upcoming[1].date.toLocaleDateString('en-US', dateOpts);
    }

    // Phase name + illumination
    const age = getMoonAge(date);
    const illum = getIlluminationPercent(age);
    const phaseName = getPhaseName(age);
    document.getElementById('phaseLine').textContent = `${phaseName} ${illum}%`;

    const today = new Date(); today.setHours(0,0,0,0);
    const compareDate = new Date(date); compareDate.setHours(0,0,0,0);
    const todayLabel = document.getElementById('todayLabel');
    if (compareDate.getTime() === today.getTime()) todayLabel.textContent = '';
    else todayLabel.textContent = date.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });

    // Moon image
    const spinner = document.getElementById('spinner');
    const moonImage = document.getElementById('moonImage');
    const moonCss = document.getElementById('moonCss');

    spinner.classList.add('active');
    moonImage.style.display = 'none';
    moonCss.classList.remove('active');

    const url = await fetchMoonImageUrl(date);
    spinner.classList.remove('active');

    if (url) {
        moonImage.onload = () => { moonImage.style.display = 'block'; };
        moonImage.onerror = () => {
            moonCss.classList.add('active');
            updateCssMoon(age);
            document.getElementById('errorNote').textContent = 'Showing an approximate moon — image failed to load';
        };
        moonImage.src = url;
    } else {
        moonCss.classList.add('active');
        updateCssMoon(age);
        document.getElementById('errorNote').textContent = 'Showing an approximate moon — image sources unavailable';
    }
}

function shiftDate(days) {
    currentDate.setDate(currentDate.getDate() + days);
    render(currentDate);
}

function openImageModal() {
    const moonImage = document.getElementById('moonImage');
    if (moonImage.style.display === 'none' || !moonImage.src) return;
    document.getElementById('modalImage').src = moonImage.src;
    document.getElementById('imageModal').classList.add('active');
}
function closeImageModal(event) {
    if (!event || event.target.id === 'imageModal' || event.target.classList.contains('modal-close')) {
        document.getElementById('imageModal').classList.remove('active');
    }
}

render(currentDate);
</script>
</body>
</html>
