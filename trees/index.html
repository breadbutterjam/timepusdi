<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- interactive-widget: lets the floating panel sit above the on-screen keyboard (Chrome/Android) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Tree Marker</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>

    <!-- Current tree type (top right). Tap to change the type used for new trees. -->
    <button id="typeChip" class="type-chip" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="type-chip-icon">🌳</span>
        <span class="type-chip-label" id="typeChipLabel"></span>
        <span class="type-chip-caret">▾</span>
    </button>

    <div id="typePicker" class="type-picker" hidden>
        <input type="search" id="typeSearch" class="type-search" placeholder="Search trees..." autocomplete="off">
        <ul id="typeList" class="type-list" role="listbox"></ul>
    </div>

    <!-- Locate me -->
    <button id="locateBtn" class="fab" type="button" aria-label="Locate me" title="Locate me">📍</button>

    <!-- Floating panel for the selected tree -->
    <section id="treePanel" class="tree-panel" hidden aria-label="Tree details">
        <div class="panel-field">
            <label for="panelType">Type</label>
            <select id="panelType"></select>
        </div>
        <div class="panel-field">
            <label for="panelName">Name</label>
            <input type="text" id="panelName" placeholder="e.g., Big tree near gate" autocomplete="off">
        </div>
        <div class="panel-field">
            <label for="panelDesc">Description</label>
            <textarea id="panelDesc" rows="2" placeholder="Add notes about this tree..."></textarea>
        </div>
        <div class="panel-coords">
            <div class="panel-field">
                <label for="panelLat">Latitude</label>
                <input type="number" id="panelLat" class="coord-input" step="any" inputmode="decimal">
            </div>
            <div class="panel-field">
                <label for="panelLng">Longitude</label>
                <input type="number" id="panelLng" class="coord-input" step="any" inputmode="decimal">
            </div>
        </div>

        <!-- Photos / media: reserved for a later phase -->

        <div class="panel-actions">
            <button id="panelDelete" class="btn btn-delete" type="button" aria-label="Delete tree" title="Delete tree">🗑️</button>
            <span class="spacer"></span>
            <button id="panelCancel" class="btn btn-secondary" type="button">Cancel</button>
            <button id="panelSave" class="btn btn-primary" type="button">Save</button>
        </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="tree-types.js"></script>
    <script src="app.js"></script>
</body>
</html>
